# The check index: the checks this repo makes available to review. Each entry
# names a check, a pointer to the method that governs it, and one line of
# purpose. When a check applies is a judgment its method states in prose, which
# triage reads; it is not a field here. The index is read from the commit under
# review, so a branch is judged against the index it carries.
#
# sprintshow carries the forced baseline, correctness and triage, the arch
# check, which holds a change to the architecture docs/architecture.md
# describes, and the pm check, which judges a change against the product goals
# docs/product-goals.md states. It is a developer library (the SprintShow
# demo-capture engine, published as @zookanalytics/sprintshow): it has no
# operator-watched surface of its own, so no demo check. Declaring the checks
# explicitly is a considered choice — it keeps triage from reading a missing
# index as an omission. Add a check here if sprintshow grows a watched surface.

[checks.correctness]
method = "formulas/mol-review.toml"
purpose = "Is the change correct and safe as merged?"

[checks.triage]
method = "skills/review-triage/SKILL.md"
purpose = "Which specialist checks does this diff warrant?"

[checks.arch]
method = "skills/review-arch/SKILL.md"
purpose = "Does the change fit the architecture, and is any architecture change justified and documented in the same PR?"

[checks.pm]
method = "skills/review-pm/SKILL.md"
purpose = "Does the change solve the right user problem, and present it so the operator can judge?"
