name: Check the installed package
description: >-
  Checks the package as npm users install it. The packed tarball goes into a project of
  its own, installed by npm 12, which blocks the install script of every dependency the
  project has not allowed, and the binaries come from the commands the README names.
  From that installed copy it lints the packaged demos, takes a browser and a terminal
  screenshot, and records a short video. A job runs it after installing npm 12 and this
  checkout's dependencies.

runs:
  using: composite
  steps:
    # The prepack script builds dist/ first, as it does for npm publish.
    - name: Pack the package
      shell: bash
      run: npm pack --pack-destination "$RUNNER_TEMP"

    # Every step after this one runs in the new project, where npx reaches the installed
    # copy's bin. The project's npmrc sets yes=false, so npx installs nothing the project
    # lacks, and each npx command runs the copy the project installed, or fails.
    - name: Install the tarball into a new project
      shell: bash
      run: |
        mkdir "$RUNNER_TEMP/project"
        cd "$RUNNER_TEMP/project"
        npm init --yes
        npm config set yes false --location project
        npm install ../zookanalytics-sprintshow-*.tgz

    - name: Fetch the browser
      shell: bash
      run: |
        cd "$RUNNER_TEMP/project"
        npx playwright install chromium-headless-shell --with-deps

    - name: Lint the packaged demos
      shell: bash
      run: |
        cd "$RUNNER_TEMP/project"
        for demo in node_modules/@zookanalytics/sprintshow/demos/*.md; do
          npx sprintshow lint "$demo"
        done

    # Taken before ffmpeg is fetched, which checks that a screenshot needs none.
    - name: Take a browser screenshot and a terminal screenshot
      shell: bash
      run: |
        cd "$RUNNER_TEMP/project"
        pkg=node_modules/@zookanalytics/sprintshow
        npx sprintshow screenshot "$pkg/demos/sample.md" --serve-dir "$pkg/examples/sample-app" -o board.png
        npx sprintshow screenshot "$pkg/demos/terminal.md" --cwd "$pkg/examples/sample-cli" -o terminal.png
        test -s board.png
        test -s terminal.png

    - name: Fetch ffmpeg
      shell: bash
      run: |
        cd "$RUNNER_TEMP/project"
        npx @zookanalytics/sprintshow provision ffmpeg

    # CI has no narration key, and --no-narrate keeps the video silent even with one.
    - name: Record a video
      shell: bash
      run: |
        cd "$RUNNER_TEMP/project"
        pkg=node_modules/@zookanalytics/sprintshow
        npx sprintshow run "$pkg/demos/sample.md" --serve-dir "$pkg/examples/sample-app" --no-narrate -o sample.mp4
        test -s sample.mp4
